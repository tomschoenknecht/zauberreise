<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7b3fa0">
<title>Land der Feenprinzessin</title>
<style>
  :root{
    --pink:#ff8fce; --pink2:#ff5fb6; --rose:#ffd0ec;
    --gold:#ffe08a; --gold2:#ffc247; --mint:#8ff0d0; --sky:#8fd6ff;
    --lila:#c99bf0; --plum:#5a1560; --text:#fff6fd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"Comic Sans MS","Segoe UI Rounded","Baloo 2",system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 600px at 50% -6%, #a95fd8 0%, transparent 55%),
      radial-gradient(700px 520px at 8% 20%, #ff7fc6 0%, transparent 46%),
      radial-gradient(760px 560px at 100% 30%, #7fd4ff 0%, transparent 46%),
      radial-gradient(820px 640px at 50% 120%, #ffd36b 0%, transparent 50%),
      linear-gradient(180deg,#6a2fa8 0%, #8a3fb0 40%, #b0559e 72%, #e07fb0 100%);
    overflow:hidden; position:fixed; inset:0; -webkit-user-select:none; user-select:none;
  }
  /* Funkeln */
  .stars{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .star{position:absolute; background:#fff; border-radius:50%; box-shadow:0 0 6px #fff,0 0 12px var(--gold);
    animation:tw 3s infinite ease-in-out;}
  @keyframes tw{0%,100%{opacity:.35; transform:scale(.7);}50%{opacity:1; transform:scale(1.3);}}
  .spark{position:absolute; pointer-events:none; opacity:0; animation:floatUp linear infinite;}
  .spark svg{width:16px; height:16px; display:block; filter:drop-shadow(0 0 4px #fff);}
  @keyframes floatUp{0%{opacity:0; transform:translateY(30px) scale(.4) rotate(0);}
    18%{opacity:1;}100%{opacity:0; transform:translateY(-150px) scale(1.1) rotate(140deg);}}

  .wrap{position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
    max-width:680px; margin:0 auto; padding:8px 14px 14px;}

  /* Kopfzeile */
  .top{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .feeMini{width:84px; flex:0 0 84px; cursor:pointer; position:relative;}
  .feeMini svg{width:100%; display:block; filter:drop-shadow(0 6px 10px rgba(80,20,90,.4)); transition:filter .7s ease;}
  /* Aufwach-Stufen sichtbar machen: verzaubert grau/matt, danach wachsendes Leuchten. */
  .feeMini[data-stage="0"] svg{filter:saturate(.15) brightness(1.08) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .feeMini[data-stage="1"] svg{filter:drop-shadow(0 0 4px rgba(255,224,138,.5)) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .feeMini[data-stage="2"] svg{filter:drop-shadow(0 0 5px rgba(255,224,138,.6)) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .feeMini[data-stage="3"] svg{filter:drop-shadow(0 0 6px rgba(255,224,138,.7)) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .feeMini[data-stage="4"] svg{filter:drop-shadow(0 0 8px rgba(255,214,120,.8)) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .feeMini[data-stage="5"] svg{filter:drop-shadow(0 0 11px rgba(255,214,120,.95)) drop-shadow(0 6px 10px rgba(80,20,90,.4));}
  .fee-locked{filter:saturate(.25) brightness(1.1);}
  .bubble{flex:1; background:rgba(255,255,255,.96); color:var(--plum); border-radius:18px;
    padding:9px 13px; font-size:clamp(13.5px,3.5vw,16.5px); font-weight:700; position:relative;
    box-shadow:0 8px 20px rgba(90,20,90,.3); min-height:48px; display:flex; align-items:center;}
  .bubble:after{content:""; position:absolute; left:-8px; top:16px; border:8px solid transparent;
    border-right-color:rgba(255,255,255,.96); border-left:0;}
  .crystals{display:flex; align-items:center; gap:5px; background:linear-gradient(180deg,#fff,#ffe6f7);
    border:2px solid #fff; border-radius:999px; padding:5px 11px; font-weight:800; color:#c23f8e;
    font-size:16px; white-space:nowrap; box-shadow:0 6px 14px rgba(90,20,90,.28);}

  .unlockBar{flex:0 0 auto; margin-top:7px;}
  .unlockBar .lab{font-size:12px; color:#fff; opacity:.96; margin-bottom:3px; font-weight:700;
    text-shadow:0 1px 6px rgba(80,20,90,.5);}
  .bar{height:12px; background:rgba(255,255,255,.28); border-radius:999px; overflow:hidden; border:1.5px solid rgba(255,255,255,.7);}
  .bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--pink2),var(--sky)); transition:width .5s ease;}

  .screen{flex:1 1 auto; overflow:auto; margin-top:10px; -webkit-overflow-scrolling:touch;}
  h2{margin:2px 0 10px; font-size:clamp(20px,5.4vw,27px); text-align:center; color:#fff;
    text-shadow:0 2px 12px rgba(80,20,90,.6);}

  .toneBtn{position:fixed; top:10px; right:10px; z-index:6; width:42px; height:42px; border-radius:50%;
    border:2px solid rgba(255,255,255,.75); background:rgba(255,255,255,.28); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;}
  .toneBtn svg{width:21px; height:21px; fill:#fff;}

  /* ---------- Eingangsgeschichte ---------- */
  .story{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:6px;}
  .storyFee{width:min(58vw,220px); aspect-ratio:200/236; position:relative;}
  .storyFee svg{width:100%; height:100%; display:block; filter:drop-shadow(0 14px 24px rgba(70,15,80,.45));}
  .storyFee .halo{position:absolute; inset:-10% -10%; border-radius:50%; z-index:-1;
    background:radial-gradient(circle at 50% 45%, rgba(255,240,180,.6), rgba(255,150,220,.25) 46%, transparent 72%);
    filter:blur(8px); animation:halo 4s ease-in-out infinite;}
  @keyframes halo{0%,100%{opacity:.7; transform:scale(1);}50%{opacity:1; transform:scale(1.07);}}
  .floaty{animation:floaty 5s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .storyText{background:rgba(255,255,255,.96); color:var(--plum); border-radius:22px; padding:16px 18px;
    max-width:440px; font-size:clamp(16px,4.3vw,20px); font-weight:700; line-height:1.4;
    box-shadow:0 12px 28px rgba(90,20,90,.3); min-height:92px; display:flex; align-items:center; justify-content:center;}
  .dots{display:flex; gap:7px;}
  .dots i{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.45);}
  .dots i.on{background:#fff; box-shadow:0 0 8px #fff;}
  .tapHint{font-size:13px; color:#fff; opacity:.9; font-weight:700;}
  .challengeBtns{display:flex; flex-direction:column; gap:10px; width:100%; max-width:360px;}

  .btn{appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:800;
    color:var(--plum); font-size:clamp(17px,4.6vw,21px); background:linear-gradient(180deg,#fff2c8,var(--gold2));
    padding:15px 24px; border-radius:999px; box-shadow:0 7px 0 #d99a2e, 0 12px 22px rgba(90,20,90,.3);
    transition:transform .08s ease, box-shadow .08s ease;}
  .btn:active{transform:translateY(4px); box-shadow:0 3px 0 #d99a2e,0 8px 16px rgba(90,20,90,.3);}
  .btn.pink{background:linear-gradient(180deg,#ffd8ef,var(--pink2)); color:#fff; box-shadow:0 7px 0 #c23f8e,0 12px 22px rgba(90,20,90,.3);}
  .btn.pink:active{box-shadow:0 3px 0 #c23f8e,0 8px 16px rgba(90,20,90,.3);}
  .btn.ghost{background:rgba(255,255,255,.9); color:var(--plum); box-shadow:0 7px 0 #c9a7d6;}
  .btn.big{font-size:clamp(19px,5.2vw,24px); padding:17px 28px;}

  /* ---------- Schatzkarte ---------- */
  .mapWrap{position:relative; padding:4px 0 16px;}
  .mapWrap svg{width:100%; height:auto; display:block; filter:drop-shadow(0 14px 30px rgba(50,15,60,.4));}
  .isle{cursor:pointer;}
  .isle .bob{animation:isleBob 4.5s ease-in-out infinite;}
  @keyframes isleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .isle.due .bob{animation:isleDue 1.1s ease-in-out infinite;}
  @keyframes isleDue{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-7px) scale(1.05);}}
  .isle:active .bob{transform:scale(.95);}
  .isleName{font:800 12.5px "Comic Sans MS",system-ui,sans-serif; fill:#4a2a12; text-anchor:middle;}
  .isleStars{font:700 11px "Comic Sans MS",system-ui,sans-serif; fill:#c23f8e; text-anchor:middle;}
  .isleCallout{font:800 10.5px "Comic Sans MS",system-ui,sans-serif; fill:#c23f8e; text-anchor:middle;}

  /* ---------- Aufgabe ---------- */
  .card{background:rgba(255,255,255,.96); border-radius:24px; padding:16px; color:var(--plum);
    box-shadow:0 12px 28px rgba(90,20,90,.3); text-align:center;}
  .q{font-size:clamp(18px,4.8vw,23px); font-weight:800; margin:2px 0 12px;}
  .visual{min-height:118px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opt{appearance:none; border:none; font-family:inherit; font-weight:800; cursor:pointer;
    font-size:clamp(22px,6vw,30px); color:var(--plum); padding:16px 8px; border-radius:18px;
    background:linear-gradient(180deg,#fff2c8,var(--gold2)); box-shadow:0 6px 0 #d99a2e;
    transition:transform .07s ease, box-shadow .07s ease;}
  .opt:active{transform:translateY(3px); box-shadow:0 3px 0 #d99a2e;}
  .opt.right{background:linear-gradient(180deg,#c9ffe9,var(--mint)); box-shadow:0 6px 0 #4fbf9a;}
  .opt.soft{opacity:.4;}
  .hintbox{margin-top:12px; background:#fff6fb; border:2px dashed var(--pink); border-radius:16px;
    padding:10px; font-size:14.5px; font-weight:700; color:var(--plum);}

  .die{background:#fff; border:3px solid var(--plum); border-radius:12px; padding:6px;}
  .frame10{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; background:var(--plum); padding:4px; border-radius:10px;}
  .cellf{width:24px; height:24px; background:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .cellf i{width:15px; height:15px; border-radius:50%; background:var(--pink2); display:none;}
  .cellf.on i{display:block;}
  .cellf.hi{outline:3px solid var(--gold); outline-offset:-3px;}
  .coin{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:#6a4a10; border:3px solid #c9a13c;
    background:radial-gradient(circle at 35% 30%, #fffbe8, #f0cf7a); box-shadow:0 4px 10px rgba(90,20,90,.25);}

  /* ---------- Großer Wunsch ---------- */
  .wishBanner{display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,240,252,.96));
    color:var(--plum); border:3px solid var(--gold); border-radius:20px; padding:9px 12px; margin-bottom:10px;
    box-shadow:0 8px 20px rgba(90,20,90,.28); cursor:pointer;}
  .wishBanner .wstar{flex:0 0 34px; width:34px; height:34px;}
  .wishBanner .wtx{flex:1; min-width:0;}
  .wishBanner .wtx b{display:block; font-size:14.5px; line-height:1.2;}
  .wishBanner .wtx span{font-size:11.5px; opacity:.8;}
  .wishBanner .wbar{height:8px; background:#f0d9ee; border-radius:999px; overflow:hidden; margin-top:5px;}
  .wishBanner .wbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold2),var(--pink2)); width:0%;}
  .wishInput{font-family:inherit; font-size:19px; text-align:center; font-weight:800; color:#6a1550;
    border:none; border-radius:14px; padding:12px 14px; width:100%; outline:3px solid var(--pink); background:#fff5fb;}
  .wishIdeas{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:10px 0 4px;}
  .wishIdea{background:#fff; border:2px solid var(--pink); color:var(--plum); border-radius:999px;
    padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}

  /* ---------- Streak: Sternen-Kette ---------- */
  .streakBar{display:flex; align-items:center; gap:10px; margin-bottom:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,244,252,.97)); color:var(--plum);
    border:2.5px solid var(--gold); border-radius:18px; padding:8px 12px; box-shadow:0 8px 20px rgba(90,20,90,.26);}
  .streakBar .stBadge{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:54px; padding:4px 8px; border-radius:14px; background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#6a1550;}
  .streakBar .stBadge b{font-size:23px; line-height:1;}
  .streakBar .stBadge i{font-size:9.5px; font-style:normal; font-weight:800; line-height:1.05; text-align:center; margin-top:2px;}
  .streakBar .stDays{flex:1; display:flex; justify-content:space-between; gap:2px;}
  .streakBar .sday{display:flex; flex-direction:column; align-items:center; gap:1px; flex:1;}
  .streakBar .sday .sstar{width:26px; height:26px;}
  .streakBar .sday .sstar svg{width:100%; height:100%; display:block;}
  .streakBar .sday .sstar.on{filter:drop-shadow(0 1px 3px rgba(230,165,47,.6));}
  .streakBar .sday span{font-size:9.5px; font-weight:800; opacity:.65;}
  .streakBar .sday.today .sstar{transform:scale(1.18);}
  .streakBar .sday.today span{opacity:1; color:var(--pink2);}
  .streakToast{position:fixed; left:50%; top:14px; transform:translate(-50%,-160%); z-index:80;
    display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,#fff6d6,var(--gold2)); color:#6a1550;
    border:2px solid #fff; border-radius:16px; padding:9px 16px 9px 12px; box-shadow:0 10px 26px rgba(90,20,90,.4);
    pointer-events:none; opacity:0; max-width:88vw; transition:transform .42s cubic-bezier(.2,1.3,.5,1), opacity .42s ease;}
  .streakToast.show{transform:translate(-50%,0); opacity:1;}
  .streakToast .stStar{flex:0 0 30px; width:30px; height:30px;}
  .streakToast .stStar svg{width:100%; height:100%; display:block;}
  .streakToast .stTx b{display:block; font-size:15px; line-height:1.15;}
  .streakToast .stTx span{font-size:12px; font-weight:700; opacity:.85;}

  /* ---------- Ermutigung: die (fotorealistische) Fee taucht beim Rechnen auf ---------- */
  /* Während sie erscheint, blenden wir die kleine Kopfzeilen-Fee + Sprechblase aus,
     damit NICHT zwei Feen gleichzeitig zu sehen sind (nur die eine, die Mut macht). */
  .top .feeMini, .top .bubble{transition:opacity .3s ease;}
  .top.cheering .feeMini, .top.cheering .bubble{opacity:0; pointer-events:none;}
  .feeCheer{position:fixed; left:50%; top:12px; transform:translate(-50%,-170%); z-index:70;
    display:flex; align-items:center; gap:11px; max-width:92vw;
    background:rgba(255,255,255,.97); color:var(--plum); border:2.5px solid var(--gold);
    border-radius:22px; padding:8px 16px 8px 8px; box-shadow:0 12px 30px rgba(90,20,90,.42);
    pointer-events:none; opacity:0; transition:transform .45s cubic-bezier(.2,1.3,.5,1), opacity .45s ease;}
  .feeCheer.show{transform:translate(-50%,0); opacity:1;}
  .feeCheer .fcPic{flex:0 0 60px; width:60px; height:60px; border-radius:50%; overflow:hidden; position:relative;
    border:3px solid #fff; box-shadow:0 4px 10px rgba(90,20,90,.32); background:linear-gradient(180deg,#bd86e6,#e59ec9);}
  .feeCheer .fcPic img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 8%;}
  .feeCheer .fcPic svg{position:absolute; left:50%; top:5px; transform:translateX(-50%); width:150%; height:150%;}
  .feeCheer .fcTx{font-weight:800; font-size:15px; line-height:1.2; max-width:62vw;}

  /* ---------- Eltern-Bereich (?eltern=1) ---------- */
  .eltern{padding-bottom:24px;}
  .eltern .eh{color:#7b46d6; margin:0 0 8px; font-size:16px;}
  .eltern .ep{font-size:12.5px; color:#6a4a7a; line-height:1.4; margin:0 0 8px;}
  .eltern .ecode{width:100%; height:72px; font-family:"Courier New",monospace; font-size:11px; border:2px solid var(--pink);
    border-radius:12px; padding:8px; resize:vertical; color:#5a1560; background:#fff7fc; margin-bottom:8px; word-break:break-all;}
  .repTop{background:#fbf1ff; border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:13.5px; color:#5a1560; line-height:1.7;}
  .repTop .repTipp{margin-top:6px; color:#c23f8e; font-weight:800;}
  .repRow{border-top:1px solid #f0d9ee; padding:9px 0;}
  .repRow .repHead{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .repRow .repHead b{color:#5a1560; font-size:14.5px;}
  .repRow .repSub{font-size:11.5px; color:#8a6a9a; margin:1px 0 5px;}
  .repRow .repStats{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:#6a4a7a; align-items:center;}
  .rd{display:inline-block; width:9px; height:9px; border-radius:50%; background:#e5d3ee; margin-left:2px; vertical-align:middle;}
  .rd.on{background:var(--gold2);}
  .tag{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .tag.neu{background:#eee; color:#888;}
  .tag.ueben{background:#ffe0ea; color:#c23f5a;}
  .tag.faellig{background:#fff0d6; color:#c98a1a;}
  .tag.gut{background:#d9f7e6; color:#2f9a5a;}

  /* ---------- Kauf-Bestätigung (mit Vorschau auf der Fee) ---------- */
  .buyBar{position:fixed; left:50%; bottom:14px; transform:translate(-50%,160%); z-index:75; width:min(92vw,430px);
    display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.98); color:var(--plum);
    border:2.5px solid var(--gold); border-radius:20px; padding:9px 11px; box-shadow:0 12px 30px rgba(90,20,90,.42);
    opacity:0; transition:transform .35s cubic-bezier(.2,1.3,.5,1), opacity .35s ease;}
  .buyBar.show{transform:translate(-50%,0); opacity:1;}
  .buyBar .bbTx{flex:1; min-width:0; line-height:1.2;}
  .buyBar .bbTx b{display:block; font-size:15px;}
  .buyBar .bbTx span{font-size:12.5px; opacity:.8;}
  .buyBar .bbBtns{display:flex; gap:7px; flex:0 0 auto;}
  .buyBar .bbBtn{appearance:none; border:none; font-family:inherit; font-weight:800; cursor:pointer; border-radius:14px;
    padding:10px 14px; font-size:14px;}
  .buyBar .bbNo{background:rgba(200,120,180,.18); color:var(--plum);}
  .buyBar .bbYes{background:linear-gradient(180deg,#ffd8ef,var(--pink2)); color:#fff; box-shadow:0 4px 0 #c23f8e;}
  .buyBar .bbYes:active{transform:translateY(2px); box-shadow:0 2px 0 #c23f8e;}

  /* ---------- Kuschelwiese (Haustiere) ---------- */
  .petStage{width:min(52vw,210px); margin:6px auto 2px; aspect-ratio:1/1;
    background:radial-gradient(circle at 50% 62%, #d6f7dd, #a9ebbb); border-radius:26px;
    border:3px solid #fff; box-shadow:0 10px 24px rgba(60,120,60,.3); position:relative; overflow:hidden;}
  .petStage .grass{position:absolute; left:0; right:0; bottom:0; height:26%;
    background:linear-gradient(180deg,#7fd898,#4fbf6a);}
  .petFloat{animation:petFloat 3.6s ease-in-out infinite;}
  @keyframes petFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .petName{text-align:center; font-weight:800; font-size:clamp(17px,4.6vw,21px); color:#fff;
    text-shadow:0 2px 10px rgba(60,120,60,.55); margin:6px 0 2px;}
  .petStatus{text-align:center; font-size:13.5px; color:#fff; font-weight:700; opacity:.95; margin-bottom:4px;}
  .petShelf{display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch;}
  .petCard{flex:0 0 auto; width:96px; background:rgba(255,255,255,.92); border-radius:16px; padding:8px 6px;
    text-align:center; cursor:pointer; border:3px solid transparent; box-shadow:0 6px 14px rgba(60,120,60,.22); color:var(--plum);}
  .petCard.active{border-color:var(--gold);}
  .petCard .thumb{width:66px; height:66px; margin:0 auto;}
  .petCard b{display:block; font-size:12px; margin-top:3px; line-height:1.15;}
  .petCard .pcost{font-size:11px; font-weight:800; color:#3fae5a;}
  .petCard .phave{font-size:11px; font-weight:700; color:#c23f8e;}

  /* ---------- Freundinnen-Lichtung ---------- */
  .friendGrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 0 10px;}
  .friendCard{position:relative; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.42);
    border-radius:18px; padding:8px 8px 10px; text-align:center; cursor:pointer; color:#fff;
    box-shadow:0 6px 16px rgba(90,20,90,.24); transition:transform .08s ease;}
  .friendCard:active{transform:scale(.97);}
  .friendCard.locked{cursor:default;}
  .friendCard .fport{width:100%; aspect-ratio:200/236; border-radius:14px; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.28), rgba(255,255,255,.04) 72%);}
  .friendCard .fport svg{width:100%; height:100%; display:block; filter:drop-shadow(0 5px 9px rgba(70,15,80,.4));}

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
/* Testmodus: eigener Speicherbereich, rührt Ylvies echten Spielstand nie an.
   Über index.html?test=1 -> "Tritt ein" betreten, oder direkt app.html?test=1 öffnen. */
var TEST = new URLSearchParams(location.search).get("test")==="1";
var ELTERN = new URLSearchParams(location.search).get("eltern")==="1";   // versteckter Eltern-Bereich
var NS = TEST ? "_test" : "";
var LS="yz_state_v1"+NS, LS_NAME="yz_fairyName"+NS, LS_INTRO="yz_introSeen"+NS, LS_MUTED="yz_muted"+NS;

/* ============ Zweiter, zäherer Speicher: Cookie-Spiegel ============
   iOS/Safari (besonders als Home-Bildschirm-App) und die ITP-Regeln löschen
   localStorage manchmal beim Neustart - dann wäre Ylvies Fortschritt weg. Deshalb
   spiegeln wir jeden Spielstand zusätzlich in einen langlebigen Cookie und stellen
   beim Start aus dem Cookie wieder her, falls localStorage leer ist. */
function setCookie(k,v){ try{ var d=new Date(); d.setTime(d.getTime()+400*864e5);
  document.cookie=k+"="+encodeURIComponent(v)+";expires="+d.toUTCString()+";path=/;SameSite=Lax"; }catch(e){} }
function delCookie(k){ try{ document.cookie=k+"=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/"; }catch(e){} }
function getCookie(k){ try{ var m=document.cookie.match("(?:^|; )"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"=([^;]*)");
  return m?decodeURIComponent(m[1]):null; }catch(e){ return null; } }
/* Beim Start beide Speicher abgleichen: localStorage hat Vorrang; fehlt er, aus dem
   Cookie zurückholen. Danach ist der localStorage wieder gefüllt. */
function syncStore(key){
  var ls=null; try{ ls=localStorage.getItem(key); }catch(e){}
  if(ls!=null){ setCookie(key, ls); return; }
  var ck=getCookie(key);
  if(ck!=null){ try{ localStorage.setItem(key, ck); }catch(e){} }
}
[LS, LS_NAME, LS_INTRO, LS_MUTED].forEach(syncStore);
/* Den Browser bitten, die Daten dauerhaft zu behalten (nicht bei Speicherknappheit
   oder durch Aufräum-Apps wegräumen). Auf Android/Chrome wird das bei täglich
   genutzten Seiten in der Regel gewährt. */
try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}

feeInject();
if(TEST){
  var testBadge=document.createElement("div");
  testBadge.textContent="TESTMODUS - wirkt sich nicht auf Ylvies Spielstand aus";
  testBadge.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;text-align:center;"+
    "background:#222;color:#ffe08a;font:700 12px system-ui,sans-serif;padding:4px;letter-spacing:.5px;";
  document.body.appendChild(testBadge);
}

/* ============ Funkeln ============ */
(function(){
  var box=$("stars"), html="";
  for(var i=0;i<55;i++){
    var s=(Math.random()*2+1).toFixed(1), x=(Math.random()*100).toFixed(2),
        y=(Math.random()*100).toFixed(2), d=(Math.random()*3).toFixed(2);
    html+='<span class="star" style="width:'+s+'px;height:'+s+'px;left:'+x+'%;top:'+y+'%;animation-delay:'+d+'s"></span>';
  }
  var starSvg='<svg viewBox="0 0 24 24"><path d="M12 1l2.6 6.6L21 9l-5 4.4L17.5 21 12 17.3 6.5 21 8 13.4 3 9l6.4-1.4z" fill="#ffe08a"/></svg>';
  for(var j=0;j<12;j++){
    var lx=(Math.random()*100).toFixed(1), du=(5+Math.random()*4).toFixed(1), de=(Math.random()*7).toFixed(1);
    html+='<span class="spark" style="left:'+lx+'%; bottom:-10px; animation-duration:'+du+'s; animation-delay:'+de+'s">'+starSvg+'</span>';
  }
  box.innerHTML=html;
})();

/* ============ Zustand ============ */
var SKILLS=["mengen","zehner","uebergang","geld","hunderter","einmaleins"];
var defaultSalon={ owned:{hair:["goldrosa"],dress:["flieder"],face:["zart"],head:["tiara"],extra:["keine"]},
                    equipped:{hair:"goldrosa",dress:"flieder",face:"zart",head:"tiara",extra:"keine"} };
/* Kleider wurden von reinen Farben auf echte Designs umgestellt: alte Farb-IDs
   auf das passendste neue Kleid abbilden, damit Ylvies Salon nicht kaputtgeht. */
var DRESS_MIGRATE={ rosalila:"flieder", minze:"blueten", sonne:"kristall", sternennacht:"sternen", kristall:"kristall" };
var DRESS_VALID=["flieder","ball","blueten","sternen","kristall"];
function migrateDresses(sal){
  if(!sal || !sal.owned) return;
  var od=sal.owned.dress||[], nd=[];
  od.forEach(function(x){ var m=DRESS_MIGRATE[x]||x; if(DRESS_VALID.indexOf(m)>=0 && nd.indexOf(m)<0) nd.push(m); });
  if(nd.indexOf("flieder")<0) nd.unshift("flieder");
  sal.owned.dress=nd;
  var eq=(sal.equipped&&sal.equipped.dress)||"flieder"; eq=DRESS_MIGRATE[eq]||eq;
  if(DRESS_VALID.indexOf(eq)<0 || nd.indexOf(eq)<0) eq="flieder";
  sal.equipped.dress=eq;
}
/* crystals = Guthaben zum Ausgeben (Salon senkt es)
   earned   = insgesamt je verdiente Kristalle - NUR daraus wächst die Fee.
   Beides muss getrennt bleiben, sonst schläft die Fee nach einem Einkauf wieder ein. */
var defaults={ crystals:0, earned:0, stage:0, solved:0, progress:0, sections:{}, skills:{},
               wish:{text:"", granted:false}, pets:{owned:[], active:"", adoptedAt:{}},
               friends:{seen:[]}, streak:{current:0, best:0, last:"", days:[]},
               salon:JSON.parse(JSON.stringify(defaultSalon)) };
SKILLS.forEach(function(s){ defaults.skills[s]={str:0, due:0, seen:0, right:0}; });
var S=load();
function load(){
  try{ var raw=localStorage.getItem(LS); if(raw){ var o=JSON.parse(raw);
    SKILLS.forEach(function(s){ if(!o.skills[s]) o.skills[s]=JSON.parse(JSON.stringify(defaults.skills[s])); });
    if(!o.salon) o.salon=JSON.parse(JSON.stringify(defaultSalon));
    migrateDresses(o.salon);
    if(typeof o.progress!=="number") o.progress=0;
    if(typeof o.earned!=="number") o.earned=o.crystals||0;  // Feinschliff unten, sobald STAGES bekannt ist
    if(!o.sections) o.sections={};
    if(!o.wish) o.wish={text:"", granted:false};
    if(!o.pets) o.pets={owned:[], active:"", adoptedAt:{}};
    if(!o.friends || !Array.isArray(o.friends.seen)) o.friends={seen:[]};
    if(!o.streak || typeof o.streak!=="object") o.streak={current:0, best:0, last:"", days:[]};
    else { if(typeof o.streak.current!=="number") o.streak.current=0;
      if(typeof o.streak.best!=="number") o.streak.best=0;
      if(typeof o.streak.last!=="string") o.streak.last="";
      if(!Array.isArray(o.streak.days)) o.streak.days=[]; }
    return o; } }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
function save(){ var s=JSON.stringify(S); try{ localStorage.setItem(LS, s); }catch(e){} setCookie(LS, s); }
function feeName(){ try{ return localStorage.getItem(LS_NAME)||"deine Fee"; }catch(e){ return "deine Fee"; } }

/* ============ Erinnerungszauber ============ */
var IV=[2*60e3,10*60e3,60*60e3,6*60*60e3,24*60*60e3,3*24*60*60e3];
function schedule(skill, correct){
  var k=S.skills[skill]; k.seen++;
  if(correct){ k.right++; k.str=Math.min(5,k.str+1); } else { k.str=Math.max(0,k.str-1); }
  k.due=Date.now()+IV[k.str];
}
function dueSkills(){ var now=Date.now(); return SKILLS.filter(function(s){ return S.skills[s].seen>0 && S.skills[s].due<=now; }); }

/* ============ Würfelhaus-Darstellungen ============ */
var PIP={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[0,2],[2,0],[2,2]],
         5:[[0,0],[0,2],[1,1],[2,0],[2,2]],6:[[0,0],[0,2],[1,0],[1,2],[2,0],[2,2]]};
function dieSVG(n,size){ size=size||60; var d=PIP[n]||[], s='<svg class="die" width="'+size+'" height="'+size+'" viewBox="0 0 60 60">';
  d.forEach(function(p){ s+='<circle cx="'+(10+p[1]*20)+'" cy="'+(10+p[0]*20)+'" r="6" fill="#5a1560"/>'; }); return s+'</svg>'; }
function diceGroup(n){ return n<=6 ? dieSVG(n) : dieSVG(5)+dieSVG(n-5); }
function frame10(n, hiEmpty){ var s='<div class="frame10">';
  for(var i=0;i<10;i++){ var on=i<n, hi=(hiEmpty&&!on)?" hi":""; s+='<div class="cellf'+(on?" on":"")+hi+'"><i></i></div>'; } return s+'</div>'; }
function coinSVG(v){ var label=(v>=100)?(v/100)+" €":v+" ct"; return '<div class="coin">'+label+'</div>'; }
/* Zehnerstange = ein Bündel von 10, plus einzelne Einer-Punkte (Zahlenraum bis 100). */
function tensBar(){ return '<svg width="20" height="70" viewBox="0 0 20 70" style="margin:2px">'+

function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function uniqOpts(correct, lo, hi, n){
  var set=[correct], guard=0;
  while(set.length<n && guard++<200){ var d=rnd(-3,3); if(d===0) continue; var v=correct+d; if(v<lo||v>hi) continue; if(set.indexOf(v)<0) set.push(v); }
  while(set.length<n){ var v2=rnd(lo,hi); if(set.indexOf(v2)<0) set.push(v2); }
  return set.sort(function(){ return Math.random()-.5; });
}

function taskHunderter(){

  if(typ===0){ a=rnd(2,7)*10; b=rnd(1,Math.min(9,(90-a)/10))*10; ans=a+b;
    q=a+" + "+b+" = ?"; vis=numberVisual(a)+'<div style="font-size:24px;font-weight:800;align-self:center">+</div>'+numberVisual(b);
    hint="Zähle nur die Zehnerstangen: "+(a/10)+" und "+(b/10)+" Stangen sind "+((a+b)/10)+" Zehner, also "+ans+".";

    q=a+" + "+b+" = ?"; vis=numberVisual(a)+'<div style="font-size:24px;font-weight:800;align-self:center">+</div>'+numberVisual(b);
    hint="Die Zehner bleiben ("+a+"), dazu kommen "+b+" Einer: "+ans+".";
  } else { a=rnd(4,9)*10; b=rnd(1,(a/10)-1)*10; ans=a-b;
    q=a+" - "+b+" = ?"; vis=numberVisual(a)+'<div style="font-size:24px;font-weight:800;align-self:center">-</div>'+numberVisual(b);
    hint="Nimm "+(b/10)+((b/10)===1?" Zehnerstange":" Zehnerstangen")+" weg: "+(a/10)+" minus "+(b/10)+" sind "+((a-b)/10)+" Zehner, also "+ans+".";

/* ============ Fee-Stufen ============
   Takt für SECHS Wochen: eine Insel bringt ca. 38 Kristalle (24 Aufgaben),
   sechs Inseln also ca. 230. Die Schwellen sind so gesetzt, dass die volle
   Befreiung der Fee der Höhepunkt am ENDE der Reise ist - und nicht schon
   nach der dritten Insel alles freigeschaltet wäre. Erste Stufe kommt bewusst
   früh (noch im ersten Abschnitt), damit Ylvie die Wirkung sofort sieht. */
var STAGES=[
  {at:0,   name:"verzaubert"},
  {at:12,  name:"Farbe kehrt zurück"},
  {at:35,  name:"sie öffnet die Augen und lächelt"},
  {at:75,  name:"sie kann sprechen"},
  {at:140, name:"sie kann sich bewegen und winken"},
  {at:220, name:"sie ist frei - sie fliegt und tanzt"}
];
var WISH_TARGET=STAGES[STAGES.length-1].at;   // Der große Wunsch geht in Erfüllung, wenn die Fee ganz frei ist
function stageFor(c){ var s=0; STAGES.forEach(function(st,i){ if(c>=st.at) s=i; }); return s; }
/* Einzahl/Mehrzahl: "1 Kristall" statt "1 Kristalle" */
function kristalle(n){ return n+(n===1?" Kristall":" Kristalle"); }
/* Nachtrag der Migration: eine schon erreichte Stufe darf nie verloren gehen. */
if(S.earned < STAGES[S.stage||0].at){ S.earned = STAGES[S.stage||0].at; save(); }

function renderFee(){
  feeStage(S.stage);
  feeCustomize(S.salon.equipped);
  $("feeMini").setAttribute("data-stage", S.stage);
  var next=STAGES[S.stage+1];
  if(next){ var prev=STAGES[S.stage].at, span=next.at-prev, have=S.earned-prev;
    $("unlockFill").style.width=Math.max(0,Math.min(100, have/span*100))+"%";
    $("unlockLab").textContent="Noch "+kristalle(Math.max(0,next.at-S.earned))+" bis: "+next.name;
  } else { $("unlockFill").style.width="100%"; $("unlockLab").textContent=feeName()+" ist ganz erwacht!"; }
  $("crystalCount").textContent=S.crystals;
}
function say(text, speak){
  $("bubble").textContent=text;
  if(speak && S.stage>=3){ try{ var u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.pitch=1.5; u.rate=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
}
/* Guthaben UND Lebensleistung erhöhen. Die Stufe richtet sich allein nach "earned"
   und kann deshalb durch Einkäufe im Salon nie wieder sinken. */
function addCrystals(n){
  S.crystals+=n; S.earned+=n;
  var ns=stageFor(S.earned); var up=ns>S.stage;
  if(ns>S.stage) S.stage=ns;
  save(); renderFee(); return up;
}

var audioCtx=null, kicherBuf=null, kReady=false, lastTake=-1, giggling=false;
var TAKES=[[2.25,3.32],[3.98,5.10],[5.43,6.45]], PITCH=1.38, KVOL=1.8;
function initAudio(){ if(audioCtx) return; try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  audioCtx=new AC(); if(audioCtx.state==="suspended") audioCtx.resume(); decodeK(); }catch(e){} }
function decodeK(){ if(kicherBuf||!audioCtx||!window.KICHER_B64) return; try{ var bin=atob(window.KICHER_B64), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); audioCtx.decodeAudioData(arr.buffer, function(b){ kicherBuf=b; kReady=true; }, function(){}); }catch(e){} }
function playGiggle(){ if(!kReady||!audioCtx||!kicherBuf) return; try{
  var i; do{ i=Math.floor(Math.random()*TAKES.length); }while(TAKES.length>1&&i===lastTake); lastTake=i;
  var seg=TAKES[i], dur=seg[1]-seg[0], src=audioCtx.createBufferSource(); src.buffer=kicherBuf;
  src.playbackRate.value=PITCH*(0.97+Math.random()*0.08); var g=audioCtx.createGain(); var t=audioCtx.currentTime;
  var play=dur/src.playbackRate.value; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(KVOL,t+0.03);
  g.gain.setValueAtTime(KVOL,t+play-0.06); g.gain.exponentialRampToValueAtTime(0.0001,t+play);
  src.connect(g); g.connect(audioCtx.destination); src.start(t,seg[0],dur); src.stop(t+play+0.02); }catch(e){} }
function giggle(){ if(giggling) return; giggling=true; setTimeout(function(){ giggling=false; },900);
  var gesture=feeTap();           // ab Stufe 4 winkt sie selbst - dann kein Hüpfen nötig
  if(gesture!=="wave"){
    var m=$("feeMini"); if(m){ m.style.transition="transform .3s"; m.style.transform="scale(1.12) rotate(-4deg)";
      setTimeout(function(){ m.style.transform="none"; },300); }
  }
  duck(); playGiggle(); }

var BGM_VOL=0.26, bgm=$("bgm"), musicOn=true, bgmNode=null, bgmGain=null, fadeTimer=null;
try{ musicOn=localStorage.getItem(LS_MUTED)!=="1"; }catch(e){}
function connectBgm(){ if(bgmNode||!audioCtx) return; try{ bgmNode=audioCtx.createMediaElementSource(bgm);
  bgmGain=audioCtx.createGain(); bgmGain.gain.value=0; bgmNode.connect(bgmGain); bgmGain.connect(audioCtx.destination); bgm.volume=1; }catch(e){ bgmGain=null; } }
function setVol(target,ms){ if(bgmGain&&audioCtx){ bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmGain.gain.setTargetAtTime(target,audioCtx.currentTime,Math.max(.05,(ms/1000)/3)); if(target===0) setTimeout(function(){ if(!musicOn) bgm.pause(); },ms+80); return; }
  clearInterval(fadeTimer); var from=bgm.volume, steps=Math.max(1,Math.round(ms/50)), i=0;
  fadeTimer=setInterval(function(){ i++; bgm.volume=Math.max(0,Math.min(1,from+(target-from)*(i/steps))); if(i>=steps){ clearInterval(fadeTimer); if(target===0) bgm.pause(); } },50); }
function startMusic(){ if(!musicOn) return; initAudio(); if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume(); connectBgm();
  if(bgm.paused){ if(!bgmGain) bgm.volume=0; var p=bgm.play(); if(p&&p.catch) p.catch(function(){}); setVol(BGM_VOL,2500); } }
function duck(){ if(bgm.paused||!musicOn) return; setVol(0.09,150); setTimeout(function(){ if(!bgm.paused&&musicOn) setVol(BGM_VOL,900); },850); }
function renderTone(){ $("icOn").style.display=musicOn?"block":"none"; $("icOff").style.display=musicOn?"none":"block"; }
$("toneBtn").addEventListener("click", function(e){ e.stopPropagation(); musicOn=!musicOn;
  try{ localStorage.setItem(LS_MUTED,musicOn?"0":"1"); }catch(e2){} setCookie(LS_MUTED,musicOn?"0":"1"); renderTone(); if(musicOn) startMusic(); else setVol(0,500); });

/* ============ Streak: Sternen-Kette ============
   Belohnt das tägliche Dranbleiben. Bewusst "klassisch, aber lieb": bei einer
   Lücke zählt die Serie freundlich wieder ab 1 - nie mit Schuld- oder Verlust-Ton.
   Der Tagesbonus sind SPENDIERBARE Kristalle (kein "earned") - er treibt die Fee
   also nicht voran, sondern ist ein Geschenk für Salon/Wiese. So bleibt die
   Fee-Stufe an echtes Rechnen gekoppelt; ein stiller Stufensprung durchs bloße
   Einloggen kann nicht passieren. Ein Tag "zählt", sobald Ylvie eine Insel
   betritt und zu zaubern beginnt. */
function pad2(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function shiftDay(s, delta){ var p=s.split("-"); var d=new Date(+p[0], (+p[1])-1, +p[2]); d.setDate(d.getDate()+delta);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function wdShort(ds){ var p=ds.split("-"); return ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(+p[0],(+p[1])-1,+p[2]).getDay()]; }
var streakPending=null;
function markActiveToday(){
  var t=todayStr(); if(S.streak.last===t) return;                 // heute schon gezählt
  var hadHistory=!!S.streak.last, prevBest=S.streak.best, cont=(S.streak.last===shiftDay(t,-1));
  S.streak.current = cont ? S.streak.current+1 : 1;
  S.streak.last=t;
  if(S.streak.current>S.streak.best) S.streak.best=S.streak.current;
  if(S.streak.days.indexOf(t)<0) S.streak.days.push(t);
  if(S.streak.days.length>40) S.streak.days=S.streak.days.slice(-40);
  var bonus=Math.min(2+S.streak.current, 8);
  S.crystals+=bonus; save(); renderFee();                         // nur Guthaben, NICHT earned
  streakPending={day:S.streak.current, bonus:bonus,
    kind:(!hadHistory?"first":(cont?"go":"back")),
    record:(S.streak.current>prevBest && S.streak.current>=3)};
}
function showStreakToast(p){
  var msg = p.record          ? ("Tag "+p.day+" - neuer Rekord!")
          : p.kind==="first"  ? "Dein erster Zauber-Stern!"
          : p.kind==="back"   ? "Schön, dass du wieder da bist!"
          : ("Tag "+p.day+" in Folge!");
  var d=document.createElement("div"); d.className="streakToast";
  d.innerHTML='<div class="stStar">'+STAR_SVG+'</div><div class="stTx"><b>'+msg+'</b><span>+'+kristalle(p.bonus)+' geschenkt</span></div>';
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.classList.add("show"); });
  setTimeout(function(){ d.classList.remove("show"); setTimeout(function(){ if(d.parentNode) d.remove(); }, 420); }, 2900);
}
/* Kette der letzten 7 Tage: ein Stern je Tag, heute hervorgehoben. */
function streakBarHtml(){
  if(!S.streak.last) return "";                                   // erst nach dem ersten Zauber-Tag
  var t=todayStr(), days="";
  for(var i=6;i>=0;i--){
    var ds=shiftDay(t,-i), active=S.streak.days.indexOf(ds)>=0, isToday=(i===0);
    var star = active
      ? '<svg viewBox="0 0 24 24"><path d="M12 2l3 7.5L23 9.5l-5.5 5 1.5 8L12 18.5 5 22.5l1.5-8L1 9.5l8-1z" fill="#ffd54a" stroke="#e6a52f" stroke-width="1"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M12 2l3 7.5L23 9.5l-5.5 5 1.5 8L12 18.5 5 22.5l1.5-8L1 9.5l8-1z" fill="none" stroke="#c99bf0" stroke-width="1.6" opacity=".7"/></svg>';
    days+='<div class="sday'+(isToday?" today":"")+'"><div class="sstar'+(active?" on":"")+'">'+star+'</div><span>'+wdShort(ds)+'</span></div>';
  }
  return '<div class="streakBar" id="streakBar">'+
    '<div class="stBadge"><b>'+S.streak.current+'</b><i>Tage<br>in Folge</i></div>'+
    '<div class="stDays">'+days+'</div></div>';
}

/* ============ Kuschelwiese (Haustiere) ============
   Ein adoptiertes Tier wächst mit dem Weiterspielen: Ei -> Baby -> groß.
   Gemessen an den seit der Adoption dazuverdienten Kristallen (earned), damit
   das Tier ein Grund zum Weitermachen ist - nicht nach Uhrzeit, sondern nach Fleiß. */
var PET_HATCH=8, PET_GROWN=40;   // Kristalle seit Adoption bis Schlüpfen / Erwachsensein
function petStage(id){
  var seit = S.earned - (S.pets.adoptedAt[id]||0);
  if(seit>=PET_GROWN) return 2;
  if(seit>=PET_HATCH) return 1;
  return 0;
}
function petAlmostHatch(id){ var seit=S.earned-(S.pets.adoptedAt[id]||0); return seit>=PET_HATCH-3 && seit<PET_HATCH; }
function petStatusText(id){
  var st=petStage(id), seit=S.earned-(S.pets.adoptedAt[id]||0);
  if(st===0) return "Noch "+kristalle(Math.max(0,PET_HATCH-seit))+", dann schlüpft es!";
  if(st===1) return "Noch "+kristalle(Math.max(0,PET_GROWN-seit))+", dann ist es groß!";
  return "Ganz gewachsen - dein treuer Freund!";
}
function adoptPet(id){
  var item=PET_CATALOG.filter(function(p){return p.id===id;})[0];
  if(S.pets.owned.indexOf(id)>=0){ removeBuyBar(); S.pets.active=id; save(); return screenWiese(); }   // schon da -> aktiv setzen
  if(S.crystals<item.cost){ say("Dafür brauchst du noch mehr Kristalle - übe weiter!", true); return; }
  showBuyConfirm("Das "+item.name+"-Ei", item.cost, function(){
    if(S.crystals<item.cost){ say("Dafür brauchst du noch mehr Kristalle - übe weiter!", true); return; }
    S.crystals-=item.cost; S.pets.owned.push(id); S.pets.active=id; S.pets.adoptedAt[id]=S.earned;
    save(); renderFee();
    say(feeName()+" freut sich: Ein "+item.name+"-Ei! Pass gut darauf auf.", true);
    screenWiese();
  });
}
function screenWiese(){
  removeBuyBar();
  showChrome(true); renderFee();
  var active=S.pets.active || S.pets.owned[0] || "";
  var html='<button class="back" id="backBtn">‹ Zurück zur Karte</button><h2>Die Kuschelwiese</h2>';
  if(active){
    var st=petStage(active);
    html+='<div class="petStage"><div class="grass"></div>'+
      '<div class="petFloat" style="position:absolute;left:15%;right:15%;top:12%;bottom:14%">'+petSvg(active, st, petAlmostHatch(active))+'</div></div>'+
      '<div class="petName">'+(st===0?"Dein "+PET_NAME(active)+"-Ei":PET_NAME(active))+'</div>'+
      '<div class="petStatus">'+petStatusText(active)+'</div>';
  } else {
    html+='<p style="text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 10px rgba(60,120,60,.5)">Such dir ein Ei aus - es schlüpft, wenn du weiter Kristalle sammelst!</p>';
  }
  html+='<div class="petShelf">'+PET_CATALOG.map(function(p){
    var owned=S.pets.owned.indexOf(p.id)>=0, isActive=p.id===active;
    var thumb=petSvg(p.id, owned?petStage(p.id):0, false);
    return '<div class="petCard'+(isActive?' active':'')+'" data-id="'+p.id+'">'+
      '<div class="thumb">'+thumb+'</div><b>'+p.name+'</b>'+
      (owned ? '<div class="phave">'+(isActive?'dabei':'auswählen')+'</div>' : '<div class="pcost">'+p.cost+' ✦</div>')+'</div>';
  }).join("")+'</div>';
  $("screen").innerHTML=html;
  $("backBtn").addEventListener("click", screenMap);
  Array.prototype.forEach.call(document.querySelectorAll(".petCard"), function(el){
    el.addEventListener("click", function(){ adoptPet(el.getAttribute("data-id")); });
  });
  say(active ? (PET_NAME(active)+" hat dich lieb!") : "Welches Tier möchtest du adoptieren?", true);
}

/* ============ Zauber-Salon ============ */
/* Kauf-Bestätigung als Leiste unten. Während sie offen ist, zeigt die Fee oben
   schon die Vorschau. Nein -> Vorschau zurücknehmen; Ja -> kaufen. */
function removeBuyBar(){ var b=$("buyBar"); if(b) b.remove(); }
function showBuyConfirm(name, cost, onYes, onNo){
  removeBuyBar();
  var d=document.createElement("div"); d.className="buyBar"; d.id="buyBar";
  d.innerHTML='<div class="bbTx"><b>'+esc(name)+'</b><span>für '+kristalle(cost)+' kaufen?</span></div>'+
    '<div class="bbBtns"><button class="bbBtn bbNo">Nein</button><button class="bbBtn bbYes">Ja, kaufen</button></div>';
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.classList.add("show"); });
  function close(){ d.classList.remove("show"); setTimeout(function(){ if(d.parentNode) d.remove(); }, 300); }
  d.querySelector(".bbYes").addEventListener("click", function(){ close(); onYes(); });
  d.querySelector(".bbNo").addEventListener("click", function(){ close(); if(onNo) onNo(); });
}
function salonBuy(cat, id){
  var owned=S.salon.owned[cat];
  if(owned.indexOf(id)>=0){ removeBuyBar(); S.salon.equipped[cat]=id; save(); renderFee(); screenSalon(); return; }
  var item=FEE_CATALOG[cat].filter(function(o){ return o.id===id; })[0];
  if(!item) return;
  if(S.crystals<item.cost){ say("Dafür brauchst du noch mehr Kristalle - übe weiter!", true); return; }
  /* Vorschau: die Fee schon mal so anziehen (ohne zu kaufen) */
  var preview={}; Object.keys(S.salon.equipped).forEach(function(k){ preview[k]=S.salon.equipped[k]; });
  preview[cat]=id; feeCustomize(preview);
  say(feeName()+" dreht sich: Na, wie sieht das aus?", true);
  showBuyConfirm(item.name, item.cost, function(){          // Ja
    if(S.crystals<item.cost){ say("Dafür brauchst du noch mehr Kristalle - übe weiter!", true); renderFee(); return; }
    S.crystals-=item.cost; owned.push(id); S.salon.equipped[cat]=id; save(); renderFee();
    say(feeName()+" strahlt: Wie schön!", true); screenSalon();
  }, function(){                                             // Nein -> Vorschau zurücknehmen
    renderFee();
    say(feeName()+" nickt: Kein Problem, schau dich ruhig um.", true);
  });
}

var lesson=null;
/* Eine Insel ist ein kleines Abenteuer in drei Abschnitten statt einer langen Liste.
   Nach jedem Abschnitt gibt es einen Rastplatz: Ylvie kann dort gefahrlos aufhören
   und später genau da weitermachen - wichtig bei ihrer kurzen Aufmerksamkeitsspanne. */
var SECTIONS=[
  {tasks:8, name:"Zum Aufwärmen",      line:"Der erste Abschnitt ist geschafft!"},
  {tasks:8, name:"Jetzt wird gezaubert", line:"Nur noch ein Abschnitt bis zum Schatz!"},
  {tasks:8, name:"Die letzte Prüfung",  line:"Der Schatz der Insel gehört dir!"}
];
var TASKS_PER_ISLAND=SECTIONS.reduce(function(a,s){ return a+s.tasks; },0);   // 24

function islandIndex(id){ for(var i=0;i<ISLANDS.length;i++){ if(ISLANDS[i].id===id) return i; } return -1; }
function islandLocked(id){ return islandIndex(id) > S.progress; }
function sectionDone(id){ return (S.sections && S.sections[id]) || 0; }
function setSectionDone(id, n){ if(!S.sections) S.sections={}; S.sections[id]=n; save(); }

function startLesson(id){
  if(islandLocked(id)){ say(feeName()+" flüstert: Eine Insel nach der anderen - lass uns erst hierbleiben.", true); return; }
  markActiveToday(); if(streakPending){ showStreakToast(streakPending); streakPending=null; }
  var is=ISLANDS.filter(function(i){return i.id===id;})[0];
  var sec=sectionDone(id);
  if(sec>=SECTIONS.length) sec=0;              // Insel erneut spielen -> wieder von vorn
  lesson={island:is, section:sec, idx:0, tries:0, gained:0, total:0, plan:[]};
  buildSectionPlan();
  nextTask();
}
/* Aufgaben nur für den aktuellen Abschnitt bauen (Schwerpunkt der Insel + fällige Wiederholungen) */
function buildSectionPlan(){
  var is=lesson.island, n=SECTIONS[lesson.section].tasks;
  var due=dueSkills().filter(function(s){ return s!==is.skill; });
  var plan=[];
  for(var i=0;i<n;i++){ if(i>0 && i%3===0 && due.length) plan.push(due[rnd(0,due.length-1)]); else plan.push(is.skill); }
  lesson.plan=plan; lesson.idx=0;
}
function pick(a){ return a[rnd(0,a.length-1)]; }
function nextTask(){
  if(lesson.idx>=lesson.plan.length) return screenSectionDone();
  lesson.task=GEN[lesson.plan[lesson.idx]](); lesson.tries=0; renderTask();
}

function renderTask(){
  var t=lesson.task;
  $("screen").innerHTML='<button class="back" id="backBtn">‹ Zurück zur Karte</button>'+
    '<div class="card"><div class="q">'+t.q+'</div><div class="visual" id="visual">'+t.visual+'</div>'+
    '<div class="opts" id="opts">'+t.opts.map(function(o){ return '<button class="opt" data-v="'+o+'">'+o+(t.unit||"")+'</button>'; }).join("")+'</div>'+
    '<div id="hintSlot"></div></div><div class="prog">'+SECTIONS[lesson.section].name+
      ' &middot; Aufgabe '+(lesson.idx+1)+' von '+lesson.plan.length+
      ' &middot; Abschnitt '+(lesson.section+1)+' von '+SECTIONS.length+'</div>';
  $("backBtn").addEventListener("click", screenMap);
  Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){ b.addEventListener("click", function(){ answer(parseInt(b.getAttribute("data-v"),10), b); }); });
  if(t.flash){ var v=$("visual"); setTimeout(function(){ if(v&&lesson&&lesson.task===t){ v.style.transition="opacity .3s"; v.style.opacity="0"; } }, 1500); }
  say(lesson.idx===0 ? ("Los geht's! "+lesson.island.name) : pick(["Und weiter!","Du schaffst das.","Noch eine!"]), false);
}
function answer(v, btn){
  var t=lesson.task;
  if(v===t.answer){
    btn.classList.add("right"); var first=(lesson.tries===0), got=first?2:1;
    lesson.gained+=got; lesson.total+=got; schedule(t.skill, first); var up=addCrystals(got);
    say(pick(["Ja! Genau richtig.","Wunderbar!","Das war zauberhaft.","Richtig!"]), true);
    lesson.sinceCheer=(lesson.sinceCheer||0)+1;                    // Fee taucht ab und zu zum Ermutigen auf
    if(lesson.sinceCheer>=3){ lesson.sinceCheer=0; setTimeout(cheerRandom, 380); }
    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(b){ b.disabled=true; if(b!==btn) b.classList.add("soft"); });
    setTimeout(function(){ lesson.idx++; if(up) return screenLevelUp(); nextTask(); }, 850);
  } else {
    lesson.tries++; btn.classList.add("soft"); btn.disabled=true;
    if(t.flash){ var v=$("visual"); if(v) v.style.opacity="1"; }
    if(lesson.tries===1){ say("Fast! Schau mal ...", true); $("hintSlot").innerHTML='<div class="hintbox">'+t.hint+'</div>'; if(t.hintVisual) $("visual").innerHTML=t.hintVisual; }
    else{ schedule(t.skill,false); var up2=addCrystals(1); lesson.gained+=1; lesson.total+=1;
      $("hintSlot").innerHTML='<div class="hintbox">Die Antwort ist <b>'+t.answer+(t.unit||"")+'</b>. '+t.hint+'</div>';
      say("Das machen wir zusammen - beim nächsten Mal kannst du es.", true);
      setTimeout(function(){ feeCheer(pick(CHEER_COMFORT)); }, 400);   // Fee macht Mut nach schwerer Aufgabe
      var b=document.createElement("button"); b.className="btn pink"; b.textContent="Weiter";
      b.addEventListener("click", function(){ lesson.idx++; if(up2) return screenLevelUp(); nextTask(); });
      $("hintSlot").appendChild(b);
      Array.prototype.forEach.call(document.querySelectorAll(".opt"), function(x){ x.disabled=true; });
    }
  }
  save();
}
function screenLevelUp(){
  var st=STAGES[S.stage];
  $("screen").innerHTML='<div class="card rewardWrap">'+feeSvgBlock().replace("storyFee","storyFee").replace('style="','style="width:min(42vw,170px);')+
    '<h2 style="color:#5a1560;text-shadow:none">Ein Zauber ist geschehen!</h2>'+
    '<p style="font-weight:800;font-size:19px;color:#ff5fb6">'+st.name+'</p>'+
    '<p style="font-weight:700">'+feeName()+' wird lebendiger. Du hast sie ein Stück befreit!</p>'+
    '<button class="btn pink" id="goOn">Weiter zaubern</button></div>';
  feeStage(S.stage); burst();
  say(feeName()+" strahlt: "+st.name+"!", true);
  $("goOn").addEventListener("click", function(){ if(lesson && lesson.idx<lesson.plan.length) nextTask(); else screenSectionDone(); });
}

/* Rastplatz nach jedem Abschnitt. Ylvie darf hier gefahrlos aufhören -
   der Abschnitt ist gespeichert, sie steigt später genau hier wieder ein. */
function screenSectionDone(){
  var secIdx=lesson.section, isLast=(secIdx>=SECTIONS.length-1);
  setSectionDone(lesson.island.id, secIdx+1);
  S.solved+=lesson.plan.length; save();
  if(isLast) return screenReward();

  var sec=SECTIONS[secIdx];
  $("screen").innerHTML='<div class="card rewardWrap">'+
    '<h2 style="color:#5a1560;text-shadow:none">'+sec.line+'</h2>'+
    '<p class="big">+'+lesson.gained+'</p>'+
    '<p style="font-weight:700">Kristalle im Abschnitt "'+sec.name+'"</p>'+
    '<p style="font-weight:700;color:#7b46d6">Noch '+(SECTIONS.length-secIdx-1)+' von '+SECTIONS.length+
      ' Abschnitten auf '+lesson.island.name+'.</p>'+
    '<button class="btn pink" id="goNext">Weiter zum nächsten Abschnitt</button>'+
    '<button class="btn ghost" id="pause" style="font-size:15px;padding:11px 18px;margin-top:8px">Pause machen</button>'+
    '<p style="font-size:12.5px;opacity:.75;margin-top:8px">Dein Abschnitt ist gespeichert - du kannst jederzeit hier weitermachen.</p>'+
    '</div>';
  say(sec.line+" Willst du weiter, oder machen wir Pause?", true);
  $("goNext").addEventListener("click", function(){
    lesson.section=secIdx+1; lesson.gained=0; buildSectionPlan(); nextTask();
  });
  $("pause").addEventListener("click", function(){ lesson=null; screenMap(); });
}
function screenReward(){
  /* solved wurde bereits im Rastplatz gezählt - hier nicht doppelt zählen. */
  var justIdx=islandIndex(lesson.island.id), unlockedNew=false, nextIsland=null;
  if(justIdx===S.progress && S.progress<ISLANDS.length-1){ S.progress++; unlockedNew=true; nextIsland=ISLANDS[S.progress]; }
  save();
  var extra = unlockedNew ?
    '<p style="font-weight:700;color:#7b46d6">Eine neue Insel taucht aus dem Nebel auf: '+nextIsland.name+'!</p>' : '';
  $("screen").innerHTML='<div class="card rewardWrap"><h2 style="color:#5a1560;text-shadow:none">Geschafft!</h2>'+
    '<p class="big">+'+lesson.total+'</p><p style="font-weight:700">Kristalle auf '+lesson.island.name+'</p>'+extra+
    '<button class="btn pink" id="toMap">Zurück zur Zauberkarte</button></div>';
  say(unlockedNew ? ("Du hast "+kristalle(lesson.total)+" gesammelt - und eine neue Insel entdeckt!") : ("Du hast "+kristalle(lesson.total)+" gesammelt!"), true);
  $("toMap").addEventListener("click", screenMap); lesson=null;
}

/* ============ Start ============ */
/* ============ Mit der Fee reden ============
   Verzaubertes Gespräch: sicher, offline, ohne KI. Die Fee antwortet mit liebevoll
   geschriebenen Antworten, je nach dem, was Ylvie tippt oder antippt. */
var chatLog=[];
function feePortraitHtml(cls){
  /* Bild fee-portrait.png liegt drüber; fehlt es, wird es entfernt und die
     gezeichnete Fee zeigt sich. So erscheint das echte Bild automatisch,
     sobald Tom es in den Projektordner legt. */
  return '<div class="'+cls+'"><svg viewBox="0 0 200 236"><use href="#feeArt"/></svg>'+
    '<img src="fee-portrait.jpg" alt="" onerror="this.remove()"></div>';
}
function speakFee(text){
  if(S.stage<3) return;
  try{ var u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.pitch=1.5; u.rate=1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function fairyReply(input){
  var s=(input||"").toLowerCase();
  var nm=feeName();
  var pet = S.pets.active ? PET_NAME(S.pets.active) : "";
  var wish = S.wish.text;
  function has(){ for(var i=0;i<arguments.length;i++){ if(s.indexOf(arguments[i])>=0) return true; } return false; }
  /* Ganzes-Wort-Prüfung für kurze/mehrdeutige Wörter (z. B. "hi" darf nicht in "hilf" treffen) */
  function hasWord(){ for(var i=0;i<arguments.length;i++){
    if(new RegExp("(^|[^a-zäöüß])"+arguments[i]+"([^a-zäöüß]|$)").test(s)) return true; } return false; }
  var negiert = has("nicht","kein");
  /* Reihenfolge: erst konkrete Themen, dann Allgemeines - damit z. B. die Frage nach
     dem Haustier nicht vom allgemeinen "wie geht" abgefangen wird. */
  if(has("wie heißt","wie heisst","dein name","heißt du","heisst du")) return "Ich heiße "+nm+" - den Namen hast DU mir geschenkt. Das vergesse ich nie.";
  if(has("tier","haustier","hase","katze","kätzchen","drache","einhorn")||(pet&&s.indexOf(pet.toLowerCase())>=0))
    return pet ? (pet+" hat dich ganz doll lieb! Je mehr du übst, desto größer wird es.") : "Auf der Kuschelwiese wartet ein Ei auf dich - daraus wird dein eigenes Tier!";
  if(has("wunsch","wünsch","wuensch")) return wish ? ("Dein Wunsch \""+wish+"\" geht in Erfüllung, wenn du mich ganz befreit hast. Wir sind auf einem guten Weg!") : "Du darfst dir einen großen Wunsch aussuchen! Tipp auf der Karte oben auf den Stern.";
  if(has("rechn","mathe","zahl","plus","minus","hilf","einmaleins")) return "Rechnen ist ganz einfach, wenn wir es zusammen machen. Tipp auf eine Insel, dann zeig ich es dir!";
  if(has("schmink","anziehen","salon","kleid","haare","frisur")) return "Oh ja! Im Zauber-Salon darfst du mich anziehen und schminken. Ich liebe es, wenn du mich hübsch machst.";
  if(has("geheimnis","geheim")) return "Psst ... ich verrate dir was: In jeder Zahl steckt ein kleiner Zauber. Und du bist die stärkste Zauberin, die ich kenne.";
  if(has("spiel","langweilig","was machen")) return "Lass uns eine Insel besuchen! Da gibt es Rätsel, Kristalle - und ich werde lebendiger. Kommst du mit?";
  if(has("traurig","weinen","angst","allein","einsam")) return "Komm her, ich bin bei dir. Alles wird gut - wir zwei schaffen alles zusammen.";
  if(has("wütend","wuetend","doof","blöd","bloed","hasse","ärger","aerger")) return "Manchmal ist alles zu viel, das kenne ich. Atme einmal tief durch - ich glaub an dich.";
  if(!negiert && has("lieb","hübsch","huebsch","schön","schoen","süß","suess","beste","mag dich")) return "Ohh, das ist so lieb! Ich hab dich auch ganz doll lieb.";
  if(has("fliegen","fliegst")) return "Wenn ich ganz frei bin, fliege und tanze ich für dich durch die Luft. Dafür brauche ich nur noch ein bisschen deine Hilfe!";
  if(has("tschüss","tschuess","ciao","schlafen","müde","muede")||hasWord("bye")) return "Bis bald, meine liebste Ylvie. Ich träume schon von unserem nächsten Abenteuer.";
  if(hasWord("hallo","hi","hey","hallöchen","moin","servus")||has("guten tag")) return "Hallo Ylvie! Ich freu mich so, dass du da bist.";
  if(has("wie geht","gehts","gehsts","wie ist es dir")) return "Mir geht es wunderbar - jedes Mal, wenn du rechnest, werde ich ein bisschen lebendiger!";
  if(hasWord("ja","klar","gerne")) return "Juhu! Ich wusste, dass du Lust hast.";
  if(hasWord("nein","nö","ne")) return "Das ist auch okay. Wir machen alles in deinem Tempo.";
  var fallback=[
    "Das finde ich spannend! Erzähl mir mehr.",
    "Hihi, mit dir zu reden macht mir Freude. Was möchtest du als Nächstes tun?",
    "Weißt du was? Du bist heute schon so tapfer gewesen. Sollen wir eine Insel besuchen?",
    "Ich hör dir so gern zu. Magst du mir ein Geheimnis verraten?"
  ];
  return fallback[Math.floor(Math.random()*fallback.length)];
}
function chatChips(){
  var c=["Wie geht es dir?","Erzähl mir ein Geheimnis","Ich hab dich lieb","Hilf mir beim Rechnen"];
  if(S.pets.active) c.push("Wie geht es "+PET_NAME(S.pets.active)+"?");
  if(S.wish.text) c.push("Wann geht mein Wunsch in Erfüllung?"); else c.push("Was ist mein Wunsch?");
  return c;
}
function chatAdd(who, text){ chatLog.push({who:who, text:text}); }
function chatRender(){
  var log=$("chatLog");
  log.innerHTML=chatLog.map(function(m){ return '<div class="msg '+(m.who==="fee"?"fee":"me")+'">'+esc(m.text)+'</div>'; }).join("");
  log.scrollTop=log.scrollHeight;
}
function chatSay(text){
  if(!text || !text.trim()) return;
  chatAdd("me", text.trim());
  var reply=fairyReply(text);
  chatAdd("fee", reply);
  chatRender(); speakFee(reply);
}
function screenChat(){
  showChrome(false);
  if(!chatLog.length){ chatAdd("fee", "Hallo Ylvie! Ich bin "+feeName()+". Womit kann ich dir helfen? Du kannst mir alles erzählen."); }
  var chips=chatChips();
  $("screen").innerHTML='<div class="chatWrap">'+
    '<div class="chatTop"><button class="back" id="backBtn">‹ Karte</button></div>'+
    feePortraitHtml("chatBig")+
    '<div class="chatTitle" style="text-align:center;margin-bottom:2px"><b>'+feeName()+'</b>'+
      '<span>'+(S.stage>=3?"Sag mir etwas!":"(sie flüstert noch ganz leise)")+'</span></div>'+
    '<div class="chatLog" id="chatLog"></div>'+
    '<div class="chatChips" id="chatChips">'+chips.map(function(c){ return '<button class="chatChip">'+esc(c)+'</button>'; }).join("")+'</div>'+
    '<div class="chatInputRow"><input id="chatInput" maxlength="60" placeholder="Sag etwas ..." autocomplete="off" spellcheck="false"><button class="chatSend" id="chatSend">Senden</button></div>'+
  '</div>';
  chatRender(); speakFee(chatLog[chatLog.length-1].text);
  $("backBtn").addEventListener("click", screenMap);
  Array.prototype.forEach.call(document.querySelectorAll(".chatChip"), function(b){
    b.addEventListener("click", function(){ chatSay(b.textContent); });
  });
  $("chatSend").addEventListener("click", function(){ var i=$("chatInput"); chatSay(i.value); i.value=""; i.focus(); });
  $("chatInput").addEventListener("keydown", function(e){ if(e.key==="Enter"){ var i=$("chatInput"); chatSay(i.value); i.value=""; } });
}

/* ============ Eltern-Bereich (über ?eltern=1) ============
   Für Tom: Lernstand sehen und Spielstand sichern/wiederherstellen. Bewusst über
   die URL versteckt, damit Ylvie nicht hineingerät. */
var SKILL_META={
  mengen:["Mengen erkennen","Anzahl auf einen Blick statt zählen"],
  zehner:["Zehnerhaus","Ergänzen zur vollen Zehn"],
  uebergang:["Zehnerübergang","Über die Zehn rechnen"],
  geld:["Mit Geld rechnen","Münzen zusammenzählen"],
  hunderter:["Zahlenraum bis 100","Zehner und Einer"],
  einmaleins:["Einmaleins","Mal-Reihen"]
};
function repDots(n,max){ var s=""; for(var i=0;i<max;i++) s+='<span class="rd'+(i<n?" on":"")+'"></span>'; return s; }
function reportHtml(){
  var now=Date.now(), weakest=null, weakStr=6;
  var rows=SKILLS.map(function(s){
    var k=S.skills[s], m=SKILL_META[s];
    var quote=k.seen>0?Math.round(k.right/k.seen*100):null;
    var faellig=k.seen>0 && k.due<=now;
    var status = k.seen===0 ? '<span class="tag neu">noch nicht geübt</span>'
      : (k.str<=1 || (quote!=null&&quote<60)) ? '<span class="tag ueben">Baustelle</span>'
      : (faellig ? '<span class="tag faellig">Wiederholung fällig</span>' : '<span class="tag gut">sitzt gut</span>');
    if(k.seen>0 && k.str<weakStr){ weakStr=k.str; weakest=m[0]; }
    return '<div class="repRow"><div class="repHead"><b>'+m[0]+'</b>'+status+'</div>'+
      '<div class="repSub">'+m[1]+'</div>'+
      '<div class="repStats"><span>Sicherheit '+repDots(k.str,5)+'</span>'+
      '<span>Trefferquote: '+(quote==null?"–":quote+"%")+'</span>'+
      '<span>geübt: '+k.seen+'×</span></div></div>';
  }).join("");
  var doneIslands=ISLANDS.filter(function(i){ return sectionDone(i.id)>=SECTIONS.length; }).length;
  var st=STAGES[S.stage]?STAGES[S.stage].name:"";
  var head='<div class="repTop">'+
    '<div><b>Fee-Stufe:</b> '+S.stage+' von 5 ('+esc(st)+')</div>'+
    '<div><b>Inseln geschafft:</b> '+doneIslands+' von '+ISLANDS.length+'</div>'+
    '<div><b>Verdiente Kristalle:</b> '+S.earned+'</div>'+
    '<div><b>Serie:</b> '+S.streak.current+' Tage in Folge (Rekord '+S.streak.best+')</div>'+
    '<div><b>Aufgaben gelöst:</b> '+S.solved+'</div>'+
    (weakest?'<div class="repTipp">Am meisten üben: '+esc(weakest)+'</div>':'')+
  '</div>';
  return head+rows;
}
function makeBackup(){
  var g=function(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } };
  var bundle={ v:1, state:S, name:g(LS_NAME), muted:g(LS_MUTED) };
  return "YZ1:"+btoa(unescape(encodeURIComponent(JSON.stringify(bundle))));
}
function restoreBackup(code){
  code=(code||"").trim(); if(code.indexOf("YZ1:")===0) code=code.slice(4);
  var json=decodeURIComponent(escape(atob(code)));
  var b=JSON.parse(json), st=(b&&b.state)?b.state:b;
  if(!st || typeof st!=="object" || !st.skills) throw new Error("kein gültiger Stand");
  var sjson=JSON.stringify(st);
  try{ localStorage.setItem(LS, sjson); }catch(e){} setCookie(LS, sjson);
  try{ localStorage.setItem(LS_INTRO, "1"); }catch(e){} setCookie(LS_INTRO, "1");
  if(b && b.name){ try{ localStorage.setItem(LS_NAME, b.name); }catch(e){} setCookie(LS_NAME, b.name); }
  if(b && b.muted){ try{ localStorage.setItem(LS_MUTED, b.muted); }catch(e){} setCookie(LS_MUTED, b.muted); }
  return true;
}
function screenEltern(){
  showChrome(false);
  var code=makeBackup();
  $("screen").innerHTML='<div class="eltern">'+
    '<h2 style="margin-top:4px">Für Eltern</h2>'+
    '<div class="card" style="text-align:left">'+
      '<h3 class="eh">Lernstand von '+esc(feeName())+'</h3>'+reportHtml()+
    '</div>'+
    '<div class="card" style="text-align:left;margin-top:12px">'+
      '<h3 class="eh">Spielstand sichern</h3>'+
      '<p class="ep">Kopiere diesen Code und schick ihn dir selbst (z.B. per Nachricht). Damit kannst du den Fortschritt jederzeit wiederherstellen - auch auf einem anderen Gerät.</p>'+
      '<textarea class="ecode" id="bkCode" readonly>'+esc(code)+'</textarea>'+
      '<button class="btn pink" id="bkCopy" style="width:100%">Code kopieren</button>'+
      '<h3 class="eh" style="margin-top:18px">Spielstand wiederherstellen</h3>'+
      '<p class="ep">Gesicherten Code hier einfügen. Achtung: überschreibt den aktuellen Stand auf diesem Gerät.</p>'+
      '<textarea class="ecode" id="rsCode" placeholder="Code hier einfügen ..."></textarea>'+
      '<button class="btn ghost" id="rsBtn" style="width:100%">Wiederherstellen</button>'+
      '<div id="rsMsg" class="ep" style="margin-top:8px;font-weight:700"></div>'+
    '</div>'+
    '<button class="btn" id="elBack" style="width:100%;margin-top:14px">Zurück zum Spiel</button>'+
  '</div>';
  $("bkCopy").addEventListener("click", function(){
    var ta=$("bkCode"); ta.focus(); ta.select();
    var ok=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); ok=true; } }catch(e){}
    if(!ok){ try{ ok=document.execCommand("copy"); }catch(e){} }
    $("bkCopy").textContent = ok ? "Kopiert!" : "Markiert - jetzt kopieren";
  });
  var armed=false;
  $("rsBtn").addEventListener("click", function(){
    var c=$("rsCode").value.trim();
    if(!c){ $("rsMsg").textContent="Bitte erst einen Code einfügen."; return; }
    if(!armed){ armed=true; $("rsBtn").textContent="Sicher? Aktuellen Stand überschreiben"; return; }
    try{ restoreBackup(c); $("rsMsg").textContent="Wiederhergestellt! Lade neu ...";
      setTimeout(function(){ location.href="app.html"; }, 800); }
    catch(e){ armed=false; $("rsBtn").textContent="Wiederherstellen"; $("rsMsg").textContent="Das war kein gültiger Code. Bitte noch einmal prüfen."; }
  });
  $("elBack").addEventListener("click", function(){ location.href="app.html"; });
}

$("feeMini").addEventListener("click", function(){
  giggle();
  if(S.stage>=2){ screenChat(); return; }   // wach -> reden
  say(feeName()+" schläft noch tief und fest ... weck sie mit dem Rechnen!", true);
});
var seen=false; try{ seen=localStorage.getItem(LS_INTRO)==="1"; }catch(e){}
if(ELTERN) screenEltern(); else if(seen) screenMap(); else screenStory();
})();
</script>
