<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kicher-Aufnahme für die Fee</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; font-family:"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#bd86e6,#c977cf 46%,#ef97c4); color:#fff; padding:22px;}
  .box{max-width:560px; margin:0 auto;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{opacity:.9; margin:0 0 18px; font-size:14.5px;}
  .card{background:rgba(255,255,255,.95); color:#5a1550; border-radius:18px; padding:18px; margin-bottom:14px;
    box-shadow:0 10px 24px rgba(120,30,100,.25);}
  button{font-family:inherit; font-weight:700; cursor:pointer; border:none; border-radius:999px;
    padding:12px 20px; font-size:16px;}
  .rec{background:#e83b6f; color:#fff; font-size:19px; padding:18px 28px; width:100%;}
  .rec.on{background:#8a1030;}
  .ghost{background:#f0e2f5; color:#5a1550; margin:4px 4px 0 0; padding:9px 14px; font-size:14px;}
  .prim{background:#ffc247; color:#5a1550;}
  .meter{height:14px; background:#eee; border-radius:999px; overflow:hidden; margin-top:12px;}
  .meter i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#8ff0d0,#ffc247,#e83b6f);
    transition:width .06s linear;}
  .take{display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-top:1px solid #eee; padding:10px 0;}
  .take b{flex:0 0 70px;}
  .status{font-size:14px; opacity:.95; margin-top:10px;}
  .warn{background:#fff3cd; color:#6a4a10; border-radius:12px; padding:10px; font-size:13.5px; margin-top:10px;}
  code{background:#f4e8f8; padding:2px 6px; border-radius:5px; font-size:13px;}
</style>
</head>
<body>
<div class="box">
  <h1>Kicher-Aufnahme für die Fee</h1>
  <p class="sub">Nimm ein leichtes, verschmitztes "hihihi" auf - 1 bis 2 Sekunden, ganz in deiner normalen Stimmlage.
     Die Feen-Tonhöhe kommt später von allein.</p>

  <div class="card">
    <button class="rec" id="recBtn">Aufnahme starten</button>
    <div class="meter"><i id="meter"></i></div>
    <div class="status" id="status">Bereit. Beim ersten Klick fragt der Browser nach dem Mikrofon.</div>
    <div class="warn" id="warn" style="display:none"></div>
  </div>

  <div class="card">
    <b>Deine Takes</b>
    <div id="takes"><p style="opacity:.6;font-size:14px">Noch keine Aufnahme.</p></div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var media=null, rec=null, chunks=[], takes=[], analyser=null, rafId=null, actx=null;

function setStatus(t){ $("status").textContent=t; }
function warn(t){ var w=$("warn"); w.style.display="block"; w.innerHTML=t; }

async function ensureMic(){
  if(media) return media;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    warn("Dieser Browser erlaubt keine Mikrofon-Aufnahme. Bitte Chrome oder Edge nutzen - und die Seite über "+
         "<code>http://localhost:5177/aufnahme.html</code> öffnen (nicht per Doppelklick auf die Datei).");
    throw new Error("no gum");
  }
  media = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false}});
  // Pegelanzeige
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    var src=actx.createMediaStreamSource(media);
    analyser=actx.createAnalyser(); analyser.fftSize=512;
    src.connect(analyser); drawMeter();
  }catch(e){}
  return media;
}
function drawMeter(){
  var data=new Uint8Array(analyser.frequencyBinCount);
  function loop(){
    analyser.getByteTimeDomainData(data);
    var peak=0;
    for(var i=0;i<data.length;i++){ var v=Math.abs(data[i]-128)/128; if(v>peak) peak=v; }
    $("meter").style.width=Math.min(100, peak*160)+"%";
    rafId=requestAnimationFrame(loop);
  }
  loop();
}

$("recBtn").addEventListener("click", async function(){
  try{
    if(rec && rec.state==="recording"){ rec.stop(); return; }
    var stream=await ensureMic();
    chunks=[];
    var mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
    rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      var blob=new Blob(chunks,{type: rec.mimeType||"audio/webm"});
      addTake(blob);
      $("recBtn").textContent="Aufnahme starten"; $("recBtn").classList.remove("on");
      setStatus("Take gespeichert. Hör ihn dir an - und nimm ruhig noch einen auf.");
    };
    rec.start();
    $("recBtn").textContent="Stopp";
    $("recBtn").classList.add("on");
    setStatus("Aufnahme läuft ... jetzt kichern!");
  }catch(e){
    setStatus("Mikrofon nicht verfügbar.");
    if(!$("warn").textContent) warn("Zugriff aufs Mikrofon wurde abgelehnt oder ist blockiert. Bitte im Browser erlauben.");
  }
});

function addTake(blob){
  var n=takes.length+1;
  takes.push(blob);
  if(n===1) $("takes").innerHTML="";
  var url=URL.createObjectURL(blob);
  var row=document.createElement("div");
  row.className="take";
  row.innerHTML='<b>Take '+n+'</b>';
  var play=document.createElement("button"); play.className="ghost"; play.textContent="Anhören";
  play.onclick=function(){ new Audio(url).play(); };
  var fee=document.createElement("button"); fee.className="ghost"; fee.textContent="Als Fee anhören";
  fee.onclick=function(){ playAsFairy(blob); };
  var dl=document.createElement("button"); dl.className="ghost prim"; dl.textContent="Speichern";
  dl.onclick=function(){
    var a=document.createElement("a"); a.href=url; a.download="kichern-"+n+".webm"; a.click();
  };
  row.appendChild(play); row.appendChild(fee); row.appendChild(dl);
  $("takes").appendChild(row);
}

// Vorschau: so klingt es später als Fee (höhere Tonlage)
async function playAsFairy(blob){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var buf=await blob.arrayBuffer();
    var audio=await actx.decodeAudioData(buf);
    var src=actx.createBufferSource(); src.buffer=audio;
    src.playbackRate.value=1.38;              // höher = feenhafter
    var g=actx.createGain(); g.gain.value=0.9;
    src.connect(g); g.connect(actx.destination);
    src.start();
  }catch(e){ setStatus("Vorschau nicht möglich: "+e.message); }
}
})();
</script>
</body>
</html>
